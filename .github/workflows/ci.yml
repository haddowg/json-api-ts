name: CI

on:
  pull_request:
  push:
    branches: [main]

# The server documents the clients are generated from install from GitHub Packages, which
# needs a token even to read.
permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Authenticate to GitHub Packages
        run: echo "NPM_CONFIG_USERCONFIG=$(.github/scripts/npm-auth)" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # Each server document pin is one exact, published version. A pull request may pin a
      # server pull request's prerelease (with a warning); main and release pull requests may not.
      - name: Pin guard
        run: pnpm check:pins

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # `pretypecheck` (and `pretest` below) run `pnpm generate`, which writes the clients and
      # MCP models from the pinned documents before anything imports them.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The generated output on disk is what the built codegen and MCP CLIs produce from the
      # pinned documents, through the CLIs' provenance-stamped `--check` mode.
      - name: Codegen drift check
        run: pnpm codegen:check

      # Packaging correctness for the publishable packages: publint validates each
      # package.json (exports/types/files/bin), attw validates types resolution under
      # both module systems. Needs the built dist (above).
      - name: Publish check
        run: pnpm lint:publish

      # Runtime proof the built dist resolves both ways (ESM import + CJS require),
      # including the @haddowg/json-api-client/ajv sub-path export.
      - name: Dual ESM/CJS smoke
        run: pnpm smoke

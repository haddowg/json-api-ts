name: Release

on:
  push:
    branches: [main]
  # Re-runs the publish from main after a failed one: pnpm publish skips any version npm
  # already has, so it publishes only what the tagged release left unpublished.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC auth for npm trusted publishing + provenance signing
  packages: read # the pinned server documents install from GitHub Packages

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The pinned server documents install from GitHub Packages. The token is scoped to this
      # step: the publish below goes to npmjs, which every published package names in its
      # publishConfig.registry, through setup-node's config above.
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export NPM_CONFIG_USERCONFIG="$(.github/scripts/npm-auth)"
          pnpm install --frozen-lockfile
          pnpm check:pins

      - run: pnpm build

      # Publishes every package whose version changed. Authentication is via
      # OIDC trusted publishing (no NPM_TOKEN) — each package must list this
      # repo + workflow as a trusted publisher on npmjs.com. --provenance signs
      # the build provenance using the same id-token permission above.
      # Requires pnpm 10.x for OIDC: pnpm 11 regressed OIDC publishing (404s —
      # pnpm/pnpm#11513), so keep the packageManager pin in package.json on 10.x.
      # The repository's .npmrc maps the @haddowg scope to GitHub Packages for the pinned server
      # documents, and pnpm resolves a scoped package's registry from that mapping before its
      # publishConfig.registry, so the scope is pointed back at npmjs here. Without it every
      # package would be checked against, and published to, GitHub Packages.
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks --provenance --@haddowg:registry=https://registry.npmjs.org/
